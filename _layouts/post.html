---
layout: base
---
<section class="content">
  <div class="wrap">
    <article class="card">
      <header class="post-header">
        <time class="post-header__date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        <h1 class="post-header__title">{{ page.title }}{% if page.subtitle %} <small class="post-header__subtitle">{{ page.subtitle }}</small>{% endif %}</h1>
      </header>
      {{ content }}
    </article>
  </div>
</section>
