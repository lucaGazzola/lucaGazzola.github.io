---
layout: base
---
<section class="hero">
  <div class="wrap hero__inner">
    <img class="hero__avatar" src="{{ site.logo | relative_url }}" alt="Portrait of {{ site.author.name }}" width="512" height="512">
    <h1 class="hero__name">{{ site.title }}</h1>
    <p class="hero__tagline">{{ site.tagline }}</p>
  </div>
</section>

<section class="content">
  <div class="wrap">
    <article class="card">
      {{ content }}
    </article>
  </div>
</section>
